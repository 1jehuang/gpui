[package]
name = "gpui_perf"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"
description = "Simulated application scenarios — forms, lists, tables — for measuring GPUI frame cost automatically"

[lib]
path = "src/gpui_perf.rs"
doctest = false

[[bin]]
name = "gpui_perf"
path = "src/main.rs"

[dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_wgpu.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
